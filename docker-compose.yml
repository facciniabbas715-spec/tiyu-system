# 仅用于本地开发环境的 Redis 依赖，不包含任何应用服务（非部署配置）。
# RAG 向量检索依赖 Redis Stack（含 RediSearch/RedisJSON 模块），普通 Redis 7 无法建向量索引。
# 使用前请确认本机 6379 端口未被占用（如已运行 D:\Redis，可先停止，
# 或通过环境变量 REDIS_PORT=6380 修改宿主机映射端口并同步更新后端配置）。
services:
  redis:
    image: redis/redis-stack-server:7.4.0-v0
    container_name: sportseq-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    environment:
      REDIS_ARGS: "--appendonly yes"

volumes:
  redis-data:
