server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: sportseq-admin
  profiles:
    active: dev
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  # ---------------------------------------------------------------
  # AI 智能客服（Spring AI 1.1.x，OpenAI 兼容协议）
  # API Key 只能通过环境变量 AI_API_KEY 提供，禁止写死在配置或代码中。
  # 常用 OpenAI 兼容服务商：
  #   OpenAI  : AI_BASE_URL=https://api.openai.com
  #   DeepSeek: AI_BASE_URL=https://api.deepseek.com            AI_MODEL=deepseek-chat
  #   DashScope: AI_BASE_URL=https://dashscope.aliyuncs.com/compatible-mode/v1  AI_MODEL=qwen-plus
  # ---------------------------------------------------------------
  ai:
    # 关闭 Spring AI OpenAI starter 的自动装配，统一由 ai/config/AiConfig 手动构建：
    # 未配置 AI_API_KEY 时应用仍可正常启动，/api/ai/chat 会返回友好提示。
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    # ---------------------------------------------------------------
    # RAG 知识库（knowledge 模块）。向量库默认复用业务 Redis（需 Redis Stack）。
    # 生产环境 debug-enabled 必须为 false，避免暴露检索片段等内部信息。
    # ---------------------------------------------------------------
    rag:
      enabled: true
      debug-enabled: false
      upload-dir: ${RAG_UPLOAD_DIR:./data/knowledge}
      top-k: ${RAG_TOP_K:4}
      similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.7}
      chunk-size: ${RAG_CHUNK_SIZE:400}
      max-file-size: ${RAG_MAX_FILE_SIZE:10485760}
      embedding:
        base-url: ${AI_EMBEDDING_BASE_URL:${AI_BASE_URL:https://api.openai.com}}
        api-key: ${AI_EMBEDDING_API_KEY:${AI_API_KEY:}}
        model: ${AI_EMBEDDING_MODEL:text-embedding-3-small}
        dimensions: ${AI_EMBEDDING_DIMENSIONS:}
      vector:
        type: ${RAG_VECTOR_STORE:redis}
        host: ${REDIS_HOST:localhost}
        port: ${REDIS_PORT:6379}
        password: ${REDIS_PASSWORD:}
        index-name: sportseq-knowledge-index
        prefix: "sportseq:knowledge:chunk:"
        persist-path: ${RAG_VECTOR_PERSIST_PATH:./data/knowledge/vector-store.json}
    openai:
      api-key: ${AI_API_KEY:}
      base-url: ${AI_BASE_URL:https://api.openai.com}
      chat:
        # 仅用于工具与知识库均不可用时的回退路径；工具就绪时使用代码内置的 AiChatPrompt.TOOL_SYSTEM_PROMPT
        system-prompt: "你是“体育器材智能客服”，隶属于体育器材管理系统。当前业务工具与知识库均不可用，请仅基于通用知识回答。请遵守：1) 使用简体中文，语气友好、专业、简洁；2) 不要编造本系统的库存数量、价格、借用人、单据号等具体数据；3) 涉及系统内具体数据或操作时，请引导用户到系统对应页面查询或办理。"
        options:
          model: ${AI_MODEL:gpt-4o-mini}
          temperature: 0.7
    # ---------------------------------------------------------------
    # AI 工具调用（业务数据查询）：AI 只能调用白名单内的只读业务工具。
    # 知识题走 RAG，库存/借阅等实时数据经工具层查 Service，禁止直连 SQL、禁止写库。
    # 关闭后客服自动退回 RAG / 纯对话路径。
    # ---------------------------------------------------------------
    tools:
      enabled: ${AI_TOOLS_ENABLED:true}

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.company.sportseq.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# JWT 配置：生产/正式环境务必通过环境变量 JWT_SECRET 覆盖默认值
jwt:
  secret: ${JWT_SECRET:sportseq-jwt-secret-key-please-change-in-production-0123456789abcdef}
  expiration: ${JWT_EXPIRATION:7200}

# 阶段 5 引入：操作日志 AOP（@Log + LogAspect）

# 阶段 2 引入：数据源、MyBatis-Plus、Druid、Flyway
# 阶段 3 引入：Redis、Spring Security
