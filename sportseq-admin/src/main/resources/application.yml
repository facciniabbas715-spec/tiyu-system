server:
  port: 8080

spring:
  application:
    name: sportseq-admin
  profiles:
    active: dev
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.company.sportseq.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# JWT 配置：生产/正式环境务必通过环境变量 JWT_SECRET 覆盖默认值
jwt:
  secret: ${JWT_SECRET:sportseq-jwt-secret-key-please-change-in-production-0123456789abcdef}
  expiration: ${JWT_EXPIRATION:7200}

# 阶段 5 引入：操作日志 AOP（@Log + LogAspect）

# 阶段 2 引入：数据源、MyBatis-Plus、Druid、Flyway
# 阶段 3 引入：Redis、Spring Security
